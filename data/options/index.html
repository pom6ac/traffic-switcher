<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <title>Options Page :: Traffic Switcher</title>
  <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
  <h1>Color Codes</h1>
  <div class="two">
    <label for="color-direct">Direct</label>
    <input type="color" id="color-direct">
    <label for="color-pac_script_url">PAC Script (URL)</label>
    <input type="color" id="color-pac_script_url">
    <label for="color-pac_script_data">PAC Script (Inline)</label>
    <input type="color" id="color-pac_script_data">
  </div>
  <h1>Misc</h1>
  <div class="two">
    <label for="startup-proxy">Startup Proxy:</label>
    <select id="startup-proxy">
      <option value="no">Do not alter</option>
      <option value="direct">Direct</option>
    </select>
  </div>

  <p>
    <button id="import">Import Settings</button>
    <button id="export">Export Settings</button>
  </p>
  <label>Importing overwrites the current PAC settings (always export a backup first). Only known settings with valid values are imported; you will be asked to confirm a PAC script change.</label>

  <p>
    <button id="reset">Factory Reset</button>
    <button id="save">Save Options</button>
    <span id="toast"></span>
  </p>
  <script src="../shared/prefs.js"></script>
  <script src="index.js"></script>
</body>
</html>
